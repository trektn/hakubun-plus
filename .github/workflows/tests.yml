name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (GTK, Qt, Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            gobject-introspection \
            libgirepository1.0-dev \
            libcairo2-dev \
            gir1.2-gtk-3.0 \
            pkg-config \
            libxkbcommon-x11-0 \
            libegl1

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync --group dev --all-extras

      - name: Run tests
        run: xvfb-run -a uv run pytest tests -q
