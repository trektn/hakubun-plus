name = "mal-oauth-relay"
main = "src/index.js"
compatibility_date = "2026-08-03"

# poopf.art is already on Cloudflare, so this is served from there instead
# of the default *.workers.dev subdomain. Requires poopf.art's zone to be
# active in the same Cloudflare account this Worker is deployed to --
# `wrangler deploy` creates the DNS record for this hostname automatically
# the first time (it shows up as a proxied CNAME to the Worker).
#
# Custom Domains map a whole hostname to a Worker -- no path component is
# allowed here. The Worker itself only responds on /mal/callback (see
# CALLBACK_PATH in src/index.js) and 404s every other path on this host.
routes = [
  { pattern = "oauth.poopf.art", custom_domain = true }
]
